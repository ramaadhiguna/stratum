# Workspace root: a "virtual manifest" (no [package] of its own), similar to a
# root package.json that only declares npm workspaces.
[workspace]
resolver = "3"
members = ["crates/*"]

# Metadata shared by every crate. A crate opts in with `version.workspace = true`, etc.
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94.1"
license = "Apache-2.0"
repository = "https://github.com/ramaadhiguna/stratum"
publish = false

# Dependency versions are declared once here; crates use `<name>.workspace = true`.
# Only list what a crate actually uses: Cargo warns about unused entries.
# (stratum-aws / stratum-db get added here once a crate depends on them.)
[workspace.dependencies]
stratum-core = { path = "crates/stratum-core" }
aws-config = "1.13.3"
aws-credential-types = "1.3.1"
aws-sdk-dynamodb = "1.140.0"
aws-sdk-s3 = "1.161.0"
aws-sdk-sqs = "1.122.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
