# ElasticMQ (SQS stand-in) configuration, HOCON format.
# Queues declared here are created at startup, so no bootstrap script is needed.
include classpath("application.conf")

# Address put into queue URLs returned to clients (GetQueueUrl, CreateQueue).
# Clients on the host reach it at localhost:9324.
node-address {
  protocol = http
  host = localhost
  port = 9324
  context-path = ""
}
generate-node-address = false

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  # Enforce real SQS limits (message size, batch size, ...) so surprises show up locally.
  sqs-limits = strict
}

queues {
  # scheduler -> classify worker (one message per raw file)
  raw-files {
    defaultVisibilityTimeout = 60 seconds
    receiveMessageWait = 0 seconds
    deadLettersQueue {
      name = "raw-files-dlq"
      maxReceiveCount = 5
    }
  }
  raw-files-dlq {}

  # classify worker -> transform worker (one message per staged data_type batch)
  transform {
    defaultVisibilityTimeout = 60 seconds
    receiveMessageWait = 0 seconds
    deadLettersQueue {
      name = "transform-dlq"
      maxReceiveCount = 5
    }
  }
  transform-dlq {}
}

aws {
  region = us-east-1
  accountId = 000000000000
}
